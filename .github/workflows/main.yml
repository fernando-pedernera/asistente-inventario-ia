name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # Instalamos requerimientos base del sistema (para OpenCV)
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
        # Instalamos requerimientos de python
        pip install -r requirements.txt
        pip install httpx pytest

    - name: Ejecutar Tests Unitarios (pytest)
      run: |
        pytest tests/

  build-docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    # Simulamos la construcción de la imagen Docker para asegurar
    # que el Dockerfile no tiene errores de sintaxis o empaquetado.
    - name: Build Docker Image
      run: |
        docker build -t inventario-api:latest .
